[package]
name = "cps-llm-demo"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
clap = { version = "4.6.1", features = ["derive", "env"] }
dotenvy = "0.15.7"
jsonschema = "0.46.5"
regex = "1.12.3"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
schemars = { version = "1.2.1", features = ["derive"] }
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "json", "env-filter"] }
url = "2.5.8"
uuid = { version = "1.23.2", features = ["v4", "serde"] }

[dev-dependencies]
assert_cmd = "2.2.2"
httpmock = "0.8.2"
insta = { version = "1.47.2", features = ["json"] }
predicates = "3.1.4"
